name: Bug report
description: Something does not work as documented
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security vulnerabilities, do not use this form; see SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Smart contracts (packages/contracts)
        - Shared library (packages/shared)
        - API (apps/api)
        - Web app (apps/web)
        - Meter simulator (apps/simulator)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm demo`
        2. Sign in as ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Node.js version, pnpm version, browser
    validations:
      required: true
