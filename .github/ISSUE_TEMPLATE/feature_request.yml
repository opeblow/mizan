name: Feature request
description: Propose an improvement or a new capability
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user (operator, verifier, importer, authority, public) is affected, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include data, contract or API changes if you know them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: invariants
    attributes:
      label: Protocol invariants
      options:
        - label: This proposal does not change the canonical reading encoding, the Merkle leaf format or the double-counting guarantees (or it explains the migration).
